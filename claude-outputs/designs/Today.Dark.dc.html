<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today — dark theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Raleway:wght@400;500;600;700&display=swap">
<style>body{margin:0;}</style>
</helmet>

<div style="width:390px;height:844px;position:relative;background:#17111C;font-family:'Raleway',sans-serif;color:#F3EBF0;overflow:hidden;box-sizing:border-box;">

  <!-- Header -->
  <div style="padding:22px 20px 0 20px;display:flex;justify-content:space-between;align-items:flex-start;">
    <div>
      <div style="font-size:13px;color:#9385A0;font-weight:600;letter-spacing:0.2px;">Wednesday, Sep 23</div>
      <div style="font-family:'Bricolage Grotesque',serif;font-weight:800;font-size:30px;color:#C08FE8;margin-top:2px;">Today</div>
    </div>
    <div style="width:40px;height:40px;border-radius:20px;background:#201829;border:1px solid #3A2E47;display:flex;align-items:center;justify-content:center;">
      <div style="display:flex;flex-direction:column;gap:4px;width:16px;">
        <div style="height:2px;background:#C4B6CE;border-radius:1px;width:16px;position:relative;"><div style="position:absolute;right:2px;top:-3px;width:6px;height:6px;border-radius:3px;background:#C08FE8;"></div></div>
        <div style="height:2px;background:#C4B6CE;border-radius:1px;width:16px;position:relative;"><div style="position:absolute;left:2px;top:-3px;width:6px;height:6px;border-radius:3px;background:#C08FE8;"></div></div>
        <div style="height:2px;background:#C4B6CE;border-radius:1px;width:16px;position:relative;"><div style="position:absolute;right:5px;top:-3px;width:6px;height:6px;border-radius:3px;background:#C08FE8;"></div></div>
      </div>
    </div>
  </div>

  <!-- Momentum hero: week strip -->
  <div style="margin:16px 20px 0 20px;background:#201829;border-radius:22px;padding:18px 18px;box-shadow:0 10px 26px rgba(0,0,0,0.4);">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;">
      <div style="font-size:12px;font-weight:700;color:#9385A0;text-transform:uppercase;letter-spacing:0.6px;">This week</div>
      <div style="font-size:13px;font-weight:700;color:#C08FE8;">5 / 7 days</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:26px;height:30px;border-radius:8px 8px 10px 10px;background:#7B45B5;"></div>
        <div style="font-size:10px;color:#9385A0;font-weight:600;">M</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:26px;height:30px;border-radius:8px 8px 10px 10px;background:#7B45B5;"></div>
        <div style="font-size:10px;color:#9385A0;font-weight:600;">T</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:30px;height:34px;border-radius:9px 9px 11px 11px;background:#C08FE8;box-shadow:0 0 0 3px rgba(192,143,232,0.35);"></div>
        <div style="font-size:10px;color:#C08FE8;font-weight:800;">W</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:26px;height:30px;border-radius:8px 8px 10px 10px;background:#2C2237;border:1.5px dashed #3A2E47;"></div>
        <div style="font-size:10px;color:#9385A0;font-weight:600;">T</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:26px;height:30px;border-radius:8px 8px 10px 10px;background:#2C2237;border:1.5px dashed #3A2E47;"></div>
        <div style="font-size:10px;color:#9385A0;font-weight:600;">F</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:26px;height:30px;border-radius:8px 8px 10px 10px;background:#2C2237;border:1.5px dashed #3A2E47;"></div>
        <div style="font-size:10px;color:#9385A0;font-weight:600;">S</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:26px;height:30px;border-radius:8px 8px 10px 10px;background:#2C2237;border:1.5px dashed #3A2E47;"></div>
        <div style="font-size:10px;color:#9385A0;font-weight:600;">S</div>
      </div>
    </div>
  </div>

  <!-- Grow your cairn card -->
  <div style="margin:14px 20px 0 20px;background:#2A2035;border:1px solid #3A2E47;border-radius:22px;padding:18px 18px 16px 18px;display:flex;align-items:center;gap:16px;">
    <div style="position:relative;width:76px;height:86px;flex-shrink:0;">
      <div style="position:absolute;bottom:0;left:4px;width:60px;height:16px;border-radius:8px 8px 14px 14px;background:#40128B;transform:rotate(-2deg);"></div>
      <div style="position:absolute;bottom:15px;left:14px;width:42px;height:3px;border-radius:2px;background:#000000;opacity:0.28;"></div>
      <div style="position:absolute;bottom:19px;left:12px;width:46px;height:15px;border-radius:7px 7px 12px 12px;background:#590D86;transform:rotate(3deg);"></div>
      <div style="position:absolute;bottom:33px;left:20px;width:32px;height:3px;border-radius:2px;background:#000000;opacity:0.30;"></div>
      <div style="position:absolute;bottom:37px;left:22px;width:32px;height:13px;border-radius:6px 6px 10px 10px;background:#8B3FAE;transform:rotate(-4deg);"></div>
      <div style="position:absolute;bottom:49px;left:28px;width:22px;height:2.5px;border-radius:2px;background:#000000;opacity:0.30;"></div>
      <div style="position:absolute;bottom:53px;left:28px;width:20px;height:11px;border-radius:5px 5px 8px 8px;background:#BA7DD6;transform:rotate(5deg);"></div>
      <div style="position:absolute;bottom:68px;left:31px;width:14px;height:14px;border-radius:7px;background:#F3EBF0;box-shadow:0 0 0 3px rgba(192,143,232,0.4), 0 0 16px 4px rgba(192,143,232,0.55);"></div>
    </div>
    <div style="flex-grow:1;">
      <div style="display:flex;align-items:baseline;gap:6px;">
        <div style="font-family:'Bricolage Grotesque',serif;font-weight:800;font-size:30px;color:#C08FE8;line-height:1;">12</div>
        <div style="font-size:14px;font-weight:700;color:#C4B6CE;">day streak</div>
      </div>
      <div style="font-size:12.5px;color:#9385A0;margin-top:5px;line-height:1.4;">3 more days adds a stone to your cairn</div>
    </div>
  </div>

  <!-- Due today -->
  <div style="margin:20px 20px 0 20px;display:flex;justify-content:space-between;align-items:center;">
    <div style="font-family:'Bricolage Grotesque',serif;font-weight:700;font-size:17px;color:#F3EBF0;">Due today</div>
    <div style="font-size:12px;font-weight:700;color:#9385A0;background:#2C2237;padding:4px 10px;border-radius:10px;">2 left</div>
  </div>

  <div style="margin:12px 20px 0 20px;display:flex;flex-direction:column;gap:10px;">

    <!-- Habit row: just completed, with burst flecks -->
    <div style="position:relative;background:#201829;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 16px rgba(0,0,0,0.4);">
      <div style="position:relative;width:52px;height:52px;flex-shrink:0;">
        <div style="width:52px;height:52px;border-radius:26px;background:#5FD3BE;display:flex;align-items:center;justify-content:center;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#12241F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div style="position:absolute;top:-4px;right:-6px;width:6px;height:6px;border-radius:3px;background:#8B3FAE;"></div>
        <div style="position:absolute;bottom:-2px;right:-8px;width:5px;height:5px;border-radius:2.5px;background:#BA7DD6;"></div>
        <div style="position:absolute;top:6px;right:-10px;width:4px;height:4px;border-radius:2px;background:#C08FE8;"></div>
      </div>
      <div style="flex-grow:1;">
        <div style="font-size:15.5px;font-weight:700;color:#F3EBF0;">Morning meditation</div>
        <div style="font-size:12px;color:#9385A0;margin-top:2px;">Done · 8:12 AM</div>
      </div>
      <div style="background:#40128B;padding:5px 10px;border-radius:12px;display:flex;align-items:center;gap:4px;">
        <div style="width:8px;height:8px;border-radius:4px;background:#EBDCF7;"></div>
        <div style="font-size:12.5px;font-weight:800;color:#EBDCF7;">12</div>
      </div>
    </div>

    <!-- Habit row: due, unchecked -->
    <div style="background:#201829;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 16px rgba(0,0,0,0.4);">
      <div style="width:52px;height:52px;border-radius:26px;border:3px solid #7FB3F0;flex-shrink:0;"></div>
      <div style="flex-grow:1;">
        <div style="font-size:15.5px;font-weight:700;color:#F3EBF0;">Read 20 pages</div>
        <div style="font-size:12px;color:#9385A0;margin-top:2px;">Not started</div>
      </div>
      <div style="background:#2C2237;padding:5px 10px;border-radius:12px;display:flex;align-items:center;gap:4px;">
        <div style="width:8px;height:8px;border-radius:4px;background:#C4B6CE;"></div>
        <div style="font-size:12.5px;font-weight:800;color:#C4B6CE;">6</div>
      </div>
    </div>

    <!-- Habit row: due, unchecked, ring progress -->
    <div style="background:#201829;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 16px rgba(0,0,0,0.4);">
      <div style="width:52px;height:52px;border-radius:26px;position:relative;flex-shrink:0;">
        <svg width="52" height="52" viewBox="0 0 52 52">
          <circle cx="26" cy="26" r="22" fill="none" stroke="#2C2237" stroke-width="4.5"/>
          <circle cx="26" cy="26" r="22" fill="none" stroke="#E8B54D" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="83" transform="rotate(-90 26 26)"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#E8B54D;">2/5</div>
      </div>
      <div style="flex-grow:1;">
        <div style="font-size:15.5px;font-weight:700;color:#F3EBF0;">Drink water</div>
        <div style="font-size:12px;color:#9385A0;margin-top:2px;">2 of 5 glasses</div>
      </div>
      <div style="background:#40128B;padding:5px 10px;border-radius:12px;display:flex;align-items:center;gap:4px;">
        <div style="width:8px;height:8px;border-radius:4px;background:#EBDCF7;"></div>
        <div style="font-size:12.5px;font-weight:800;color:#EBDCF7;">41</div>
      </div>
    </div>
  </div>

  <!-- Bottom nav -->
  <div style="position:absolute;left:0;right:0;bottom:0;height:78px;background:#201829;border-top:1px solid #3A2E47;display:flex;justify-content:space-around;align-items:center;padding-bottom:12px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <div style="width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:11px solid #C08FE8;"></div>
      <div style="font-size:11px;font-weight:800;color:#C08FE8;">Today</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#9385A0" stroke-width="2"/><path d="M8 12.5l2.5 2.5L16 9.5" stroke="#9385A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style="font-size:11px;font-weight:600;color:#9385A0;">Habits</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="#9385A0" stroke-width="2"/><path d="M8 12h8M8 16h5" stroke="#9385A0" stroke-width="2" stroke-linecap="round"/></svg>
      <div style="font-size:11px;font-weight:600;color:#9385A0;">Tasks</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="5" y="13" width="3.5" height="7" rx="1" fill="#9385A0"/><rect x="10.25" y="9" width="3.5" height="11" rx="1" fill="#9385A0"/><rect x="15.5" y="5" width="3.5" height="15" rx="1" fill="#9385A0"/></svg>
      <div style="font-size:11px;font-weight:600;color:#9385A0;">Stats</div>
    </div>
  </div>

  <!-- FAB -->
  <div style="position:absolute;right:20px;bottom:96px;width:56px;height:56px;border-radius:28px;background:#C08FE8;box-shadow:0 8px 20px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#230A38" stroke-width="2.5" stroke-linecap="round"/></svg>
  </div>

</div>
