  <div style="position:absolute;top:120px;left:310px;width:8px;height:8px;border-radius:4px;background:#9A620F;transform:rotate(20deg);"></div>
  <div style="position:absolute;top:150px;left:40px;width:7px;height:14px;border-radius:3px;background:#157F73;transform:rotate(30deg);"></div>
  <div style="position:absolute;top:95px;left:200px;width:9px;height:9px;border-radius:4.5px;background:#EDDCF5;"></div>
  <div style="position:absolute;top:200px;left:330px;width:9px;height:9px;border-radius:4.5px;background:#B03A5B;"></div>
  <div style="position:absolute;top:230px;left:20px;width:8px;height:8px;border-radius:4px;background:#EDDCF5;"></div>
  <div style="position:absolute;top:560px;left:50px;width:8px;height:8px;border-radius:4px;background:#BA7DD6;"></div>
  <div style="position:absolute;top:600px;left:330px;width:10px;height:10px;border-radius:5px;background:#9A620F;"></div>

    <!-- big cairn with glow -->
    <div style="position:relative;width:130px;height:125px;margin-bottom:14px;">
      <div style="position:absolute;left:6px;top:16px;right:6px;bottom:6px;border-radius:60px;background:radial-gradient(circle,#BA7DD6 0%,rgba(186,125,214,0) 70%);opacity:0.5;"></div>
      <div style="position:absolute;bottom:0;left:6px;width:87px;height:23px;border-radius:12px 12px 20px 20px;background:#40128B;transform:rotate(-2deg);"></div>
      <div style="position:absolute;bottom:22px;left:20px;width:61px;height:4px;border-radius:3px;background:#17101F;opacity:0.10;"></div>
      <div style="position:absolute;bottom:28px;left:17px;width:67px;height:22px;border-radius:10px 10px 17px 17px;background:#590D86;transform:rotate(3deg);"></div>

    <div style="font-size:13px;font-weight:800;color:#9A620F;letter-spacing:1px;text-transform:uppercase;">Milestone</div>
    <div style="font-family:'Bricolage Grotesque',serif;font-weight:800;font-size:52px;color:#590D86;line-height:1;margin-top:6px;">30</div>
    <div style="font-size:16px;font-weight:700;color:#17101F;margin-top:2px;">day streak</div>

    <div style="font-size:14px;color:#4A3B55;line-height:1.5;margin-top:14px;">You've never gone this far before.<br>That's who you are now.</div>

    <div style="width:100%;height:1px;background:#E2D3D6;margin:22px 0 18px 0;"></div>

    <div style="width:100%;background:#590D86;border-radius:16px;padding:14px 0;text-align:center;">
      <span style="font-size:15px;font-weight:700;color:#FFFFFF;">Share your cairn</span>
    </div>
    <div style="width:100%;padding:14px 0;text-align:center;">

    </div>
  </div>

</div>
</x-dc>
