<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Habits list — redesigned</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Raleway:wght@400;500;600;700&display=swap">
<style>body{margin:0;}</style>
</helmet>

<div style="width:390px;height:844px;position:relative;background:#FAF3F0;font-family:'Raleway',sans-serif;color:#17101F;overflow:hidden;box-sizing:border-box;">

  <!-- Header -->
  <div style="padding:22px 20px 0 20px;display:flex;justify-content:space-between;align-items:center;">
    <div style="font-family:'Bricolage Grotesque',serif;font-weight:800;font-size:30px;color:#590D86;">Habits</div>
    <div style="background:#EDDCF5;border-radius:14px;padding:7px 12px;display:flex;align-items:center;gap:6px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2v20M4 8l16 8M20 8L4 16" stroke="#590D86" stroke-width="2" stroke-linecap="round"/></svg>
      <span style="font-size:12.5px;font-weight:800;color:#590D86;">2 freezes</span>
    </div>
  </div>

  <div style="margin:18px 20px 8px 20px;font-size:12px;font-weight:700;color:#7A6885;text-transform:uppercase;letter-spacing:0.6px;">Due today</div>

  <div style="margin:0 20px;display:flex;flex-direction:column;gap:10px;">

    <!-- Habit: 100-day milestone glow -->
    <div style="position:relative;background:#FFFFFF;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 0 0 2px #BA7DD6, 0 10px 22px rgba(186,125,214,0.35);">
      <div style="position:relative;width:46px;height:50px;flex-shrink:0;">
        <div style="position:absolute;bottom:0;left:2px;width:36px;height:10px;border-radius:5px 5px 8px 8px;background:#40128B;transform:rotate(-2deg);"></div>
        <div style="position:absolute;bottom:9px;left:8px;width:25px;height:2px;border-radius:1px;background:#17101F;opacity:0.08;"></div>
        <div style="position:absolute;bottom:11px;left:7px;width:28px;height:9px;border-radius:4px 4px 7px 7px;background:#590D86;transform:rotate(3deg);"></div>
        <div style="position:absolute;bottom:20px;left:12px;width:19px;height:2px;border-radius:1px;background:#17101F;opacity:0.10;"></div>
        <div style="position:absolute;bottom:22px;left:13px;width:19px;height:8px;border-radius:4px 4px 6px 6px;background:#8B3FAE;transform:rotate(-4deg);"></div>
        <div style="position:absolute;bottom:33px;left:19px;width:9px;height:9px;border-radius:4.5px;background:#FAF3F0;box-shadow:0 0 0 2px #EDDCF5, 0 0 8px 3px rgba(186,125,214,0.5);"></div>
      </div>
      <div style="flex-grow:1;">
        <div style="font-size:15.5px;font-weight:700;color:#17101F;">Evening walk</div>
        <div style="font-size:12px;color:#8B3FAE;margin-top:2px;font-weight:700;">100-day milestone today</div>
      </div>
      <div style="background:#590D86;padding:5px 10px;border-radius:12px;display:flex;align-items:center;gap:4px;">
        <div style="width:8px;height:8px;border-radius:4px;background:#FAF3F0;"></div>
        <div style="font-size:12.5px;font-weight:800;color:#FFFFFF;">100</div>
      </div>
    </div>

    <!-- Habit: normal, unchecked -->
    <div style="background:#FFFFFF;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 16px rgba(89,13,134,0.06);">
      <div style="width:48px;height:48px;border-radius:24px;border:3px solid #2B62A8;flex-shrink:0;"></div>
      <div style="flex-grow:1;">
        <div style="font-size:15.5px;font-weight:700;color:#17101F;">Read 20 pages</div>
        <div style="font-size:12px;color:#7A6885;margin-top:2px;">Daily</div>
      </div>
      <div style="background:#F2E7E2;padding:5px 10px;border-radius:12px;display:flex;align-items:center;gap:4px;">
        <div style="width:8px;height:8px;border-radius:4px;background:#4A3B55;"></div>
        <div style="font-size:12.5px;font-weight:800;color:#4A3B55;">6</div>
      </div>
    </div>

    <!-- Habit: freeze used yesterday, forgiven, no shame styling -->
    <div style="position:relative;background:#FFFFFF;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 16px rgba(89,13,134,0.06);">
      <div style="width:48px;height:48px;border-radius:24px;border:3px solid #157F73;flex-shrink:0;"></div>
      <div style="flex-grow:1;">
        <div style="font-size:15.5px;font-weight:700;color:#17101F;">Stretch routine</div>
        <div style="font-size:12px;color:#7A6885;margin-top:2px;">Freeze used yesterday — streak safe</div>
      </div>
      <div style="background:#EDDCF5;padding:5px 10px;border-radius:12px;display:flex;align-items:center;gap:4px;">
        <div style="width:8px;height:8px;border-radius:4px;background:#590D86;"></div>
        <div style="font-size:12.5px;font-weight:800;color:#590D86;">24</div>
      </div>
    </div>

  </div>

  <div style="margin:22px 20px 10px 20px;display:flex;justify-content:space-between;align-items:center;">
    <div style="font-size:12px;font-weight:700;color:#7A6885;text-transform:uppercase;letter-spacing:0.6px;">Done today</div>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="#7A6885" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div style="margin:0 20px;background:#FBF7F5;border:1px solid #E2D3D6;border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;">
    <span style="font-size:14px;font-weight:600;color:#4A3B55;">2 habits completed</span>
    <span style="font-size:13px;color:#7A6885;">Morning meditation, Drink water</span>
  </div>

  <!-- Bottom nav -->
  <div style="position:absolute;left:0;right:0;bottom:0;height:78px;background:#FFFFFF;border-top:1px solid #E2D3D6;display:flex;justify-content:space-around;align-items:center;padding-bottom:12px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <div style="width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:11px solid #7A6885;"></div>
      <div style="font-size:11px;font-weight:600;color:#7A6885;">Today</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#590D86" stroke-width="2"/><path d="M8 12.5l2.5 2.5L16 9.5" stroke="#590D86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style="font-size:11px;font-weight:800;color:#590D86;">Habits</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="#7A6885" stroke-width="2"/><path d="M8 12h8M8 16h5" stroke="#7A6885" stroke-width="2" stroke-linecap="round"/></svg>
      <div style="font-size:11px;font-weight:600;color:#7A6885;">Tasks</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="5" y="13" width="3.5" height="7" rx="1" fill="#7A6885"/><rect x="10.25" y="9" width="3.5" height="11" rx="1" fill="#7A6885"/><rect x="15.5" y="5" width="3.5" height="15" rx="1" fill="#7A6885"/></svg>
      <div style="font-size:11px;font-weight:600;color:#7A6885;">Stats</div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
